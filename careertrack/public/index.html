<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerTrack — Job Application Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><span class="eyebrow">CAREERTRACK</span><h1>Job Application Dashboard</h1><p>Track applications, interviews and offers in one place.</p></div><button id="openForm" class="primary">+ Add application</button></header>
<main>
<section class="stats"><article><span>Total applications</span><strong id="total">0</strong></article><article><span>Interviews</span><strong id="interviews">0</strong></article><article><span>Pending</span><strong id="pending">0</strong></article><article><span>Offers</span><strong id="offers">0</strong></article></section>
<section class="toolbar"><input id="search" placeholder="Search company or role..."><select id="statusFilter"><option value="">All statuses</option><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Rejected</option></select><select id="typeFilter"><option value="">All types</option><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select></section>
<section id="cards" class="grid"></section><div id="empty" class="empty hidden">No applications match your filters.</div>
</main>
<dialog id="modal"><form id="appForm"><div class="modalHead"><div><span class="eyebrow">NEW RECORD</span><h2>Add application</h2></div><button type="button" class="icon" id="closeForm">×</button></div><div class="formGrid"><label>Company<input name="company" required placeholder="e.g. Infosys"></label><label>Role<input name="role" required placeholder="e.g. Software Engineer"></label><label>Location<input name="location" placeholder="Hyderabad / Remote"></label><label>Type<select name="type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select></label><label>Status<select name="status"><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label>Salary<input name="salary" placeholder="₹ 4–6 LPA"></label><label>Date applied<input name="applied_date" type="date" required></label><label class="wide">Notes<textarea name="notes" placeholder="Next step, recruiter contact, preparation notes..."></textarea></label></div><button class="primary wideBtn">Save application</button></form></dialog>
<script src="app.js"></script></body></html>
